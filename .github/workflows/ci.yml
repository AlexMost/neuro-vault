name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Smoke the built binary
        run: |
          test "$(node dist/cli.js --version)" = "$(node -p "require('./package.json').version")"
          node dist/cli.js --help > /dev/null
      - name: Test
        run: npm test

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate PR commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Validate pushed commit messages
        if: github.event_name == 'push'
        run: npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose

  profile-tokenizers:
    name: Profile tokenizers (pinned revisions)
    runs-on: ubuntu-latest
    env:
      NEURO_VAULT_HF_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/neuro-vault/models
          key: profile-tokenizers-${{ hashFiles('src/modules/semantic/model-profiles.ts') }}
      - name: Verify each profile's tokenizer
        run: npx vitest run test/integration/profile-tokenizers.test.ts
